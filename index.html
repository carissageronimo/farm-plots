<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Farm Plot Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one plot per screen, read outdoors on a phone. Big plot code on top, plantings as stacked rows with a to-scale timeline. */
:root{
  --bg:#F4F7F3; --surface:#FFFFFF; --ink:#12281E; --muted:#51675A; --line:#D3DDD5;
  --accent:#1B6B55; --accent-ink:#FFFFFF;
  --c-sow:#9A6A3C; --c-germ:#3F9B73; --c-thin:#C99412; --c-feed:#4673B0; --c-harv:#1B6B55; --c-grow:#D5E0D8;
  --today:#C2410C; --warn-bg:#FBEBD9; --warn-ink:#7A3A0A;
  --font-display:"Space Grotesk",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1914; --surface:#15251D; --ink:#E6F0E9; --muted:#9BB2A4; --line:#29402F;
    --accent:#6CCB9D; --accent-ink:#0E1914;
    --c-sow:#C99262; --c-germ:#5FBE91; --c-thin:#E3B93E; --c-feed:#79A2DA; --c-harv:#6CCB9D; --c-grow:#2B4236;
    --today:#FF9A62; --warn-bg:#3A2A18; --warn-ink:#F2C99B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1914; --surface:#15251D; --ink:#E6F0E9; --muted:#9BB2A4; --line:#29402F;
  --accent:#6CCB9D; --accent-ink:#0E1914;
  --c-sow:#C99262; --c-germ:#5FBE91; --c-thin:#E3B93E; --c-feed:#79A2DA; --c-harv:#6CCB9D; --c-grow:#2B4236;
  --today:#FF9A62; --warn-bg:#3A2A18; --warn-ink:#F2C99B; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:14px}
.plot-code{font-family:var(--font-display);font-weight:700;font-size:clamp(44px,14vw,72px);line-height:1;margin:0;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);font-size:14px}
.switch{display:flex;flex-wrap:wrap;gap:8px}
.switch a{font-family:var(--font-display);font-weight:500;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);
  background:var(--surface);padding:8px 14px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center}
.switch a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.switch a:focus-visible,.row summary:focus-visible{outline:3px solid var(--today);outline-offset:2px}
h2{font-family:var(--font-display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.who{min-width:0}
.sub-id{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.1}
.crop{font-size:15px;color:var(--ink)}
.crop small{color:var(--muted);font-size:13px}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--c-grow);color:var(--ink);white-space:nowrap}
.pill.harv{background:var(--c-harv);color:var(--accent-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.next{margin:0;font-size:14px;color:var(--muted)}
.next b{color:var(--ink);font-weight:600}
.bar{position:relative;height:14px;border-radius:7px;background:var(--c-grow);margin-top:4px}
.seg{position:absolute;top:0;bottom:0;border-radius:7px;min-width:6px}
.seg.sow{background:var(--c-sow)}.seg.germ{background:var(--c-germ)}.seg.thin{background:var(--c-thin)}
.seg.feed{background:var(--c-feed)}.seg.harv{background:var(--c-harv)}
.today{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--today);border-radius:2px}
.today::after{content:"today";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--today)}
.bar-wrap{padding-top:14px}
.dates{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
.dates li{display:contents}
.dates .k{color:var(--muted);display:flex;align-items:center;gap:7px}
.dates .k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dates .v{font-variant-numeric:tabular-nums}
.note{margin:0;font-size:14px;color:var(--muted)}
details.fin>summary{cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 0}
details.fin .list{margin-top:10px}
.row.done{opacity:.85}
.index{display:flex;flex-direction:column;gap:12px}
.index a{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:16px}
.index a span:first-child{font-family:var(--font-display);font-weight:700;font-size:28px}
.index a span:last-child{color:var(--muted);font-size:14px;text-align:right}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s}}
</style></head><body>

<div class="wrap" id="app"></div>

<script>
/* Snapshot of the farm calendar and Farm Log, Nov 24 2026. s = sown date; stages in order. */
const UPDATED = "2026-11-24";
const PLOTS = {
  "a2":   {code:"A2",   blurb:"Arugula rows and CHB holes"},
  "b1-1": {code:"B1.1", blurb:"Sitaw, cilantro and peppermint"},
  "d2":   {code:"D2",   blurb:"Cilantro, frisee and the next arugula"}
};
const P = [
 {plot:"a2",sub:"A2.3",crop:"Arugula",variety:"Rocquette",s:"2026-11-20",st:"growing",
  stages:[["germ","Germination","2026-11-22","2026-11-23"],["thin","Thinning","2026-12-11","2026-12-12"],["harv","Harvest","2026-12-11","2027-01-20"]],
  note:"Baby leaves from Dec 11, full size from Dec 20."},
 {plot:"a2",sub:"A2.4",crop:"Arugula",variety:"Rocquette",s:"2026-10-29",st:"growing",
  stages:[["germ","Germination","2026-10-31","2026-11-01"],["thin","Thinning","2026-11-30","2026-12-01"],["harv","Harvest","2026-11-19","2026-12-29"]]},
 {plot:"a2",sub:"A2.CHB2",crop:"Arugula",variety:"Rocquette",s:"2026-10-29",st:"growing",
  stages:[["germ","Germination","2026-10-31","2026-11-01"],["thin","Thinning","2026-11-30","2026-12-01"],["harv","Harvest","2026-11-19","2026-12-29"]]},
 {plot:"a2",sub:"A2.CHB1",crop:"Arugula",variety:"Rocquette",s:"2026-09-08",st:"ended",note:"22 CHB holes.",
  stages:[["germ","Germination","2026-09-10","2026-09-11"],["thin","Thinning","2026-09-29","2026-09-30"],["harv","Harvest","2026-09-30","2026-11-08"]]},
 {plot:"a2",sub:"A2.1",crop:"Arugula",variety:"Rocquette",s:"2026-09-08",st:"ended",
  stages:[["germ","Germination","2026-09-10","2026-09-11"],["thin","Thinning","2026-09-29","2026-09-30"],["harv","Harvest","2026-09-29","2026-11-08"]]},

 {plot:"b1-1",sub:"B1.1",crop:"Sitaw",variety:"Scarlet Max",s:"2026-10-15",st:"growing",
  stages:[["germ","Germination","2026-10-18","2026-10-20"],["thin","Thinning","2026-10-22","2026-10-29"],["feed","Vermi side dressing","2026-11-24","2026-12-01"],["harv","Harvest","2026-12-14","2026-12-24"]]},
 {plot:"b1-1",sub:"B1.1.CHB1",crop:"Cilantro",variety:"",s:"2026-08-02",st:"growing",
  stages:[["germ","Germination","2026-08-09","2026-08-12"],["harv","Harvest","2026-09-21","2026-12-13"]]},
 {plot:"b1-1",sub:"B1.1.CHB2",crop:"Cilantro",variety:"",s:"2026-08-02",st:"growing",
  stages:[["germ","Germination","2026-08-09","2026-08-12"],["harv","Harvest","2026-09-21","2026-12-13"]]},
 {plot:"b1-1",sub:"B1.1",crop:"Peppermint",variety:"",s:null,st:"growing",stages:[],note:"Established and kept in place. No dates tracked."},
 {plot:"b1-1",sub:"B1.1.1 and B1.1.3",crop:"Sitaw",variety:"Scarlet Max",s:"2026-08-02",st:"ended",
  stages:[["germ","Germination","2026-08-05","2026-08-07"],["harv","Harvest","2026-10-01","2026-10-11"]]},

 {plot:"d2",sub:"D2.2",crop:"Cilantro",variety:"",s:"2026-07-23",st:"growing",
  stages:[["germ","Germination","2026-07-30","2026-08-02"],["harv","Harvest","2026-09-11","2026-12-03"]]},
 {plot:"d2",sub:"D2.3",crop:"Frisee",variety:"",s:null,st:"growing",stages:[],note:"Growing. Sowing and harvest dates are not on the calendar yet."},
 {plot:"d2",sub:"D2.1",crop:"Arugula",variety:"Rocquette",s:"2026-12-20",st:"planned",
  stages:[["germ","Germination","2026-12-22","2026-12-23"],["thin","Thinning","2027-01-10","2027-01-11"],["harv","Harvest","2027-01-10","2027-02-19"]],
  note:"Bed prepared Nov 16. Refresh by Dec 13."},
 {plot:"d2",sub:"D2.1",crop:"Arugula",variety:"Rocquette",s:"2026-09-08",st:"ended",
  stages:[["germ","Germination","2026-09-10","2026-09-11"],["thin","Thinning","2026-09-29","2026-09-30"],["harv","Harvest","2026-09-29","2026-11-08"]]},
 {plot:"d2",sub:"D2.CHB2",crop:"Arugula",variety:"Rocquette",s:"2026-09-08",st:"ended",note:"18 CHB holes.",
  stages:[["germ","Germination","2026-09-10","2026-09-11"],["thin","Thinning","2026-09-29","2026-09-30"],["harv","Harvest","2026-09-30","2026-11-08"]]}
];

const DAY=86400000, MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const d=(s)=>{const[y,m,x]=s.split("-").map(Number);return new Date(y,m-1,x,12)};
const now=new Date(); const today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
const days=(a,b)=>Math.round((b-a)/DAY);
const fmt=(dt)=>MON[dt.getMonth()]+" "+dt.getDate()+(dt.getFullYear()!==2026?", "+dt.getFullYear():"");
const rng=(a,b)=>a===b?fmt(d(a)):fmt(d(a))+(d(a).getMonth()===d(b).getMonth()&&d(a).getFullYear()===d(b).getFullYear()?"–"+d(b).getDate():" – "+fmt(d(b)));
const inN=(n)=>n===0?"today":n===1?"tomorrow":"in "+n+" days";

function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function status(p){
  if(p.st==="planned")return{label:"Planned",cls:"",next:"Sowing "+fmt(d(p.s))+" ("+inN(days(today,d(p.s)))+")"};
  if(p.st==="ended")return{label:"Finished",cls:"",next:null};
  let label="Growing",cls="";
  const cur=p.stages.find(x=>today>=d(x[2])&&today<=d(x[3]));
  if(cur){label=cur[1]==="Harvest"?"Harvesting":cur[1]==="Germination"?"Germinating":cur[1]==="Thinning"?"Thinning window":cur[1];cls=cur[0]==="harv"?"harv":""}
  else if(p.stages.length){const last=p.stages[p.stages.length-1];if(today>d(last[3])){label="Past planned last harvest";cls="warn"}}
  const nx=p.stages.filter(x=>d(x[2])>today).sort((a,b)=>d(a[2])-d(b[2]))[0];
  return{label,cls,next:nx?nx[1]+" "+rng(nx[2],nx[3])+" ("+inN(days(today,d(nx[2])))+")":null};
}

function bar(p){
  if(!p.s||!p.stages.length)return null;
  const s=d(p.s), end=new Date(Math.max(...p.stages.map(x=>d(x[3]).getTime())));
  const total=Math.max(1,days(s,end)+1), pct=(dt)=>Math.max(0,Math.min(100,days(s,dt)/total*100));
  const wrap=h("div","bar-wrap"), b=h("div","bar");
  const add=(cls,a,z)=>{const e=h("div","seg "+cls);e.style.left=pct(a)+"%";e.style.width=Math.max(1.2,(days(a,z)+1)/total*100)+"%";b.appendChild(e)};
  add("sow",s,s);
  p.stages.forEach(x=>add(x[0],d(x[2]),d(x[3])));
  if(today>=s&&today<=end){const t=h("div","today");t.style.left="calc("+pct(today)+"% - 1px)";b.appendChild(t)}
  b.setAttribute("role","img");b.setAttribute("aria-label","Timeline from sowing to last harvest");
  wrap.appendChild(b);return wrap;
}

function dates(p){
  const ul=h("ul","dates");
  const li=(color,k,v)=>{const l=document.createElement("li"),a=h("span","k"),i=h("i");i.style.background=color;a.appendChild(i);a.appendChild(document.createTextNode(k));l.appendChild(a);l.appendChild(h("span","v",v));ul.appendChild(l)};
  const col={germ:"var(--c-germ)",thin:"var(--c-thin)",feed:"var(--c-feed)",harv:"var(--c-harv)"};
  if(p.s)li("var(--c-sow)","Sown",fmt(d(p.s)));
  p.stages.forEach(x=>li(col[x[0]],x[1],rng(x[2],x[3])));
  return ul;
}

function row(p){
  const done=p.st==="ended", S=status(p), r=h("article","row"+(done?" done":""));
  const top=h("div","top"), who=h("div","who");
  who.appendChild(h("div","sub-id",p.sub));
  const c=h("div","crop",p.crop+" ");if(p.variety){c.appendChild(h("small",null,p.variety))}
  who.appendChild(c);top.appendChild(who);top.appendChild(h("span","pill "+S.cls,S.label));r.appendChild(top);
  if(S.next){const n=h("p","next");n.appendChild(h("b",null,"Next: "));n.appendChild(document.createTextNode(S.next));r.appendChild(n)}
  const b=bar(p);if(b)r.appendChild(b);
  if(p.s||p.stages.length)r.appendChild(dates(p));
  if(p.note)r.appendChild(h("p","note",p.note));
  return r;
}

function section(title,items){
  if(!items.length)return null;
  const s=document.createElement("section");s.appendChild(h("h2",null,title));
  const l=h("div","list");items.forEach(p=>l.appendChild(row(p)));s.appendChild(l);return s;
}

function render(){
  const app=document.getElementById("app");app.textContent="";
  const key=(location.hash||"").replace(/^#/,"").toLowerCase();
  const header=document.createElement("header");
  if(!PLOTS[key]){
    header.appendChild(h("h1","plot-code","Farm plots"));
    header.appendChild(h("p","sub","Scan the code on a plot, or choose one."));
    app.appendChild(header);
    const idx=h("nav","index");
    Object.keys(PLOTS).forEach(k=>{const a=document.createElement("a");a.href="#"+k;
      const n=P.filter(p=>p.plot===k&&p.st==="growing").length;
      a.appendChild(h("span",null,PLOTS[k].code));a.appendChild(h("span",null,n+" growing now"));idx.appendChild(a)});
    app.appendChild(idx);
  } else {
    header.appendChild(h("h1","plot-code",PLOTS[key].code));
    header.appendChild(h("p","sub",PLOTS[key].blurb+". Updated "+fmt(d(UPDATED))+"."));
    const sw=h("nav","switch");sw.setAttribute("aria-label","Plots");
    Object.keys(PLOTS).forEach(k=>{const a=document.createElement("a");a.href="#"+k;a.textContent=PLOTS[k].code;if(k===key)a.setAttribute("aria-current","page");sw.appendChild(a)});
    header.appendChild(sw);app.appendChild(header);
    const items=P.filter(p=>p.plot===key);
    const g=section("Growing now",items.filter(p=>p.st==="growing"));
    const n=section("Coming up",items.filter(p=>p.st==="planned"));
    [g,n].forEach(x=>x&&app.appendChild(x));
    const fin=items.filter(p=>p.st==="ended");
    if(fin.length){const det=document.createElement("details");det.className="fin";
      const sm=document.createElement("summary");sm.textContent="Finished ("+fin.length+")";det.appendChild(sm);
      const l=h("div","list");fin.forEach(p=>l.appendChild(row(p)));det.appendChild(l);app.appendChild(det)}
  }
  const f=document.createElement("footer");
  f.textContent="Dates are targets from the farm calendar and the Farm Log. Cut-and-come-again crops such as arugula often keep producing after the last date.";
  app.appendChild(f);
}
window.addEventListener("hashchange",render);render();
</script>
</body></html>
