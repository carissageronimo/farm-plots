<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Essentialist Vegetable Farm Plot Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#FBF6EA;--card:#FFFFFF;--ink:#1F3D2B;--muted:#5E6F62;--line:#E6DDC6;--leaf:#6F5A38;--leaf-ink:#FFFFFF;--soft:#F1E9D6;
 --sow:#A66A3A;--germ:#58A05F;--thin:#E0A526;--feed:#4F86B8;--harv:#2F6B3A;--today:#D2693A;--warn:#FBE7D3;--warn-ink:#7A3A0A;
 --fd:"Fraunces",Georgia,serif;--fb:"Nunito",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130D;--card:#211C13;--ink:#EEF3E2;--muted:#A8B9A0;--line:#3A3222;--leaf:#D9BF8A;--leaf-ink:#1B1710;--soft:#2A241A;
 --sow:#D49A66;--germ:#7CC784;--thin:#EDBB4A;--feed:#7FAEDB;--harv:#8CCB86;--today:#FF9A62;--warn:#3A2A18;--warn-ink:#F2C99B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130D;--card:#211C13;--ink:#EEF3E2;--muted:#A8B9A0;--line:#3A3222;--leaf:#D9BF8A;--leaf-ink:#1B1710;--soft:#2A241A;
 --sow:#D49A66;--germ:#7CC784;--thin:#EDBB4A;--feed:#7FAEDB;--harv:#8CCB86;--today:#FF9A62;--warn:#3A2A18;--warn-ink:#F2C99B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;
 padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:12px;padding:18px 0 4px}
.brand img{width:44px;height:auto;flex:none}
.brand b{display:block;font-family:var(--fd);font-weight:700;font-size:20px;line-height:1.1}
.brand span{font-size:13px;color:var(--muted)}
.hero{background:var(--soft);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.code{font-family:var(--fd);font-weight:700;font-size:clamp(48px,16vw,80px);line-height:1;margin:0;color:var(--leaf)}
.sub{margin:0;color:var(--muted);font-size:15px}
.switch{display:flex;flex-wrap:wrap;gap:8px}
.switch a{font-weight:700;text-decoration:none;color:var(--ink);border:2px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center}
.switch a[aria-current="page"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
a:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid var(--today);outline-offset:2px}
h2{font-family:var(--fd);font-size:20px;margin:0 0 10px;font-weight:600}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sid{font-family:var(--fd);font-weight:700;font-size:22px;line-height:1.1}
.crop{font-size:16px;font-weight:600}.crop small{color:var(--muted);font-weight:400;font-size:14px}
.pill{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.harv{background:var(--leaf);color:var(--leaf-ink)}.pill.warn{background:var(--warn);color:var(--warn-ink)}
.next{margin:0;font-size:14px;color:var(--muted)}.next b{color:var(--ink)}
.barw{padding-top:16px}.bar{position:relative;height:14px;border-radius:7px;background:var(--soft)}
.seg{position:absolute;top:0;bottom:0;border-radius:7px;min-width:6px}
.sow{background:var(--sow)}.germ{background:var(--germ)}.thin{background:var(--thin)}.feed{background:var(--feed)}.harv{background:var(--harv)}
.today{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--today);border-radius:2px}
.today::after{content:"today";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--today)}
.dates{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
.dates li{display:contents}.k{color:var(--muted);display:flex;align-items:center;gap:7px}.k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.v{font-variant-numeric:tabular-nums}
.note{margin:0;font-size:14px;color:var(--muted)}
details>summary{cursor:pointer;font-family:var(--fd);font-weight:600;font-size:18px;padding:6px 0}
details .list{margin-top:10px}.row.done{opacity:.85}
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.index a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.index a b{font-family:var(--fd);font-size:28px;color:var(--leaf)}.index a span{color:var(--muted);font-size:13px}
.crops{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -4px;padding-inline:4px}
.cc{flex:0 0 min(78%,280px);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;margin:0}
.cc .ph{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:44px;color:var(--leaf)}
.cc img{width:100%;height:100%;object-fit:cover;display:block}
.cc figcaption{padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.cc b{font-size:16px}.cc small{font-size:12px;color:var(--muted)}.cc small a{color:inherit}
.cc .own{font-size:12px;font-weight:700;color:var(--leaf)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
button.pr{align-self:flex-start;font:inherit;font-weight:700;border:2px solid var(--leaf);background:transparent;color:var(--leaf);padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px}
@page{size:A5 portrait;margin:10mm}
@media print{body{background:#fff;color:#000;padding:0}.crops{flex-wrap:wrap;overflow:visible}.cc{flex:0 0 46%;break-inside:avoid}.switch,button.pr,.index{display:none}.row,.hero{break-inside:avoid;box-shadow:none}.hero{background:#F1E9D6}}
</style></head><body>

 const s=p.s?d(p.s):d(p.stages[0][2]),end=new Date(Math.max(...p.stages.map(x=>d(x[3]).getTime())));
 if(today<s)return"planned";
 if(today>end)return days(end,today)>14?"ended":"late";
 return"growing"}
function status(p){
 const st=stat(p);
 if(st==="planned")return{label:"Planned",cls:"",next:"Sowing "+fmt(d(p.s))+" ("+inN(days(today,d(p.s)))+")"};
 if(st==="ended")return{label:"Finished",cls:"",next:null};
 let label="Growing",cls="";
 const cur=p.stages.find(x=>today>=d(x[2])&&today<=d(x[3]));
 if(cur){label=cur[1]==="Harvest"?"Harvesting":cur[1]==="Germination"?"Germinating":cur[1]==="Thinning"?"Thinning window":cur[1];cls=cur[0]==="harv"?"harv":""}
 if(st==="late"){label="Past planned last harvest";cls="warn"}
 const nx=p.stages.filter(x=>d(x[2])>today).sort((a,b)=>d(a[2])-d(b[2]))[0];
 return{label,cls,next:nx?"Next: "+nx[1]+" "+rng(nx[2],nx[3])+" ("+inN(days(today,d(nx[2])))+")":null}}
function bar(p){
 if(!p.s||!p.stages.length)return null;
 const s=d(p.s),end=new Date(Math.max(...p.stages.map(x=>d(x[3]).getTime())));
 const total=Math.max(1,days(s,end)+1),pct=t=>Math.max(0,Math.min(100,days(s,t)/total*100));
 const w=h("div","barw"),b=h("div","bar");
 const add=(c,a,z)=>{const e=h("div","seg "+c);e.style.left=pct(a)+"%";e.style.width=Math.max(1.2,(days(a,z)+1)/total*100)+"%";b.appendChild(e)};
 add("sow",s,s);p.stages.forEach(x=>add(x[0],d(x[2]),d(x[3])));
 if(today>=s&&today<=end){const t=h("div","today");t.style.left="calc("+pct(today)+"% - 1px)";b.appendChild(t)}
 b.setAttribute("role","img");b.setAttribute("aria-label","Timeline from sowing to last harvest");w.appendChild(b);return w}
function dates(p){
 const ul=h("ul","dates"),col={germ:"var(--germ)",thin:"var(--thin)",feed:"var(--feed)",harv:"var(--harv)"};
 const li=(c,k,v)=>{const l=document.createElement("li"),a=h("span","k"),i=h("i");i.style.background=c;a.appendChild(i);a.appendChild(document.createTextNode(k));l.appendChild(a);l.appendChild(h("span","v",v));ul.appendChild(l)};
 if(p.s)li("var(--sow)","Sown",fmt(d(p.s)));
 p.stages.forEach(x=>li(col[x[0]],x[1],rng(x[2],x[3])));return ul}
function row(p){
 const S=status(p),r=h("article","row"+(S.label==="Finished"?" done":"")),top=h("div","top"),who=h("div");
 who.appendChild(h("div","sid",p.sub));const c=h("div","crop",p.crop+" ");if(p.variety)c.appendChild(h("small",null,p.variety));who.appendChild(c);
 top.appendChild(who);top.appendChild(h("span","pill "+S.cls,S.label));r.appendChild(top);
 if(S.next){const n=h("p","next");n.textContent=S.next;r.appendChild(n)}
 const b=bar(p);if(b)r.appendChild(b);
 if(p.s||p.stages.length)r.appendChild(dates(p));
 if(p.note)r.appendChild(h("p","note",p.note));return r}
function section(t,items){if(!items.length)return null;const s=document.createElement("section");s.appendChild(h("h2",null,t));const l=h("div","list");items.forEach(p=>l.appendChild(row(p)));s.appendChild(l);return s}

function ckey(p){const c=p.crop.toLowerCase(),v=(p.variety||"").toLowerCase();
 if(c==="okra"&&v.includes("red"))return "okra-red";if(c==="tomato"&&v==="wild")return "tomato-wild";return c.replace(/[^a-z]+/g,"-")}
function crops(items){
 const seen=new Map();items.forEach(p=>{const k=ckey(p);if(!seen.has(k))seen.set(k,p)});if(!seen.size)return null;
 const s=document.createElement("section");s.appendChild(h("h2",null,"What these crops look like"));const row=h("div","crops");
 seen.forEach((p,k)=>{const f=document.createElement("figure");f.className="cc";const ph=h("div","ph",p.crop[0]);const o=OWN[k],r=REF[k];
  if(o||r){const im=document.createElement("img");im.loading="lazy";im.decoding="async";im.src=o?o[0]:r[0];im.alt=p.crop+(p.variety?" ("+p.variety+")":"");
   im.addEventListener("error",()=>{im.remove();ph.textContent=p.crop[0]});ph.textContent="";ph.appendChild(im)}
  f.appendChild(ph);const cap=document.createElement("figcaption");const nm=h("b",null,p.crop+(p.variety?" · "+p.variety:""));cap.appendChild(nm);
  if(o){cap.appendChild(h("span","own","Photo from our farm"+(o[1]?", "+fmt(d(o[1])):"")))}
  else if(r){const sm=h("small",null,"Reference photo, not this plot · ");const a=document.createElement("a");a.href=r[1];a.rel="noopener";a.target="_blank";a.textContent=r[2]+", "+r[3];sm.appendChild(a);cap.appendChild(sm)}
  f.appendChild(cap);row.appendChild(f)});
 s.appendChild(row);return s}
function brand(){const b=h("div","brand");b.innerHTML=LEAF;const t=h("div");t.appendChild(h("b",null,"Essentialist Vegetable Farm"));t.appendChild(h("span",null,"Amadeo, Cavite · Plot guide"));b.appendChild(t);return b}
function render(){
 const app=document.getElementById("app");app.textContent="";app.appendChild(brand());
 const ALIAS={"b1-1":"b1","b1-2":"b1"};const raw=(location.hash||"").replace(/^#/,"").toLowerCase(),key=ALIAS[raw]||raw,pl=PLOTS.find(x=>x[0]===key);
 if(!pl){
  const hero=h("div","hero");hero.appendChild(h("h1","code","Our plots"));hero.appendChild(h("p","sub","Scan the code on a plot, or choose one below."));app.appendChild(hero);
  const idx=h("nav","index");PLOTS.forEach(x=>{const a=document.createElement("a");a.href="#"+x[0];a.appendChild(h("b",null,x[1]));
   const n=P.filter(p=>p.plot===x[0]&&["growing","late"].includes(stat(p))).length;a.appendChild(h("span",null,n?n+" growing now":"Nothing growing now"));idx.appendChild(a)});app.appendChild(idx);
 }else{
  const hero=h("div","hero");hero.appendChild(h("h1","code",pl[1]));hero.appendChild(h("p","sub",pl[2]+" · updated "+fmt(d(UPDATED))));app.appendChild(hero);
  const sw=h("nav","switch");sw.setAttribute("aria-label","Plots");
  PLOTS.forEach(x=>{const a=document.createElement("a");a.href="#"+x[0];a.textContent=x[1];if(x[0]===key)a.setAttribute("aria-current","page");sw.appendChild(a)});app.appendChild(sw);
  const items=P.filter(p=>p.plot===key),by=k=>items.filter(p=>k.includes(stat(p)));
  const g=section("Growing now",by(["growing","late"])),n=section("Coming up",by(["planned"]));
  const live=items.filter(p=>["growing","late","planned"].includes(stat(p))),cs=crops(live.length?live:items);if(cs)app.appendChild(cs);
  [g,n].forEach(x=>x&&app.appendChild(x));
  if(!g&&!n){const e=h("p","sub","Nothing is growing here right now.");app.appendChild(e)}
  const fin=by(["ended"]);
  if(fin.length){const det=document.createElement("details"),sm=document.createElement("summary");sm.textContent="Finished ("+fin.length+")";det.appendChild(sm);const l=h("div","list");fin.forEach(p=>l.appendChild(row(p)));det.appendChild(l);app.appendChild(det)}
 }
 const f=document.createElement("footer");
 if(pl)f.appendChild(h("span",null,"Reference photos come from Wikimedia Commons under the licences shown. Photos marked \u201cfrom our farm\u201d were taken here."));
 f.appendChild(h("span",null,"Dates are targets from the farm calendar and Farm Log. Arugula and other cut-and-come-again crops often keep producing after the last date."));
 const bt=h("button","pr","Print this plot");bt.type="button";bt.addEventListener("click",()=>window.print());if(pl)f.appendChild(bt);
 app.appendChild(f)}
window.addEventListener("hashchange",render);render();
