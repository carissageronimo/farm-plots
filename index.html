<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Essentialist Farm Plot Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#FBF6EA;--card:#FFFFFF;--ink:#1F3D2B;--muted:#5E6F62;--line:#E6DDC6;--leaf:#2F6B3A;--leaf-ink:#FFFFFF;--soft:#E9F0DC;
 --sow:#A66A3A;--germ:#58A05F;--thin:#E0A526;--feed:#4F86B8;--harv:#2F6B3A;--today:#D2693A;--warn:#FBE7D3;--warn-ink:#7A3A0A;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13200F;--card:#1B2D18;--ink:#EEF3E2;--muted:#A8B9A0;--line:#2F4429;--leaf:#8CCB86;--leaf-ink:#13200F;--soft:#243A20;
 --sow:#D49A66;--germ:#7CC784;--thin:#EDBB4A;--feed:#7FAEDB;--harv:#8CCB86;--today:#FF9A62;--warn:#3A2A18;--warn-ink:#F2C99B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13200F;--card:#1B2D18;--ink:#EEF3E2;--muted:#A8B9A0;--line:#2F4429;--leaf:#8CCB86;--leaf-ink:#13200F;--soft:#243A20;
 --sow:#D49A66;--germ:#7CC784;--thin:#EDBB4A;--feed:#7FAEDB;--harv:#8CCB86;--today:#FF9A62;--warn:#3A2A18;--warn-ink:#F2C99B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;
 padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:12px;padding:18px 0 4px}
.brand svg{width:44px;height:44px;flex:none}
.brand b{display:block;font-family:var(--fd);font-weight:700;font-size:20px;line-height:1.1}
.brand span{font-size:13px;color:var(--muted)}
.hero{background:var(--soft);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.code{font-family:var(--fd);font-weight:700;font-size:clamp(48px,16vw,80px);line-height:1;margin:0;color:var(--leaf)}
.sub{margin:0;color:var(--muted);font-size:15px}
.switch{display:flex;flex-wrap:wrap;gap:8px}
.switch a{font-weight:700;text-decoration:none;color:var(--ink);border:2px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center}
.switch a[aria-current="page"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
a:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid var(--today);outline-offset:2px}
h2{font-family:var(--fd);font-size:20px;margin:0 0 10px;font-weight:600}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sid{font-family:var(--fd);font-weight:700;font-size:22px;line-height:1.1}
.crop{font-size:16px;font-weight:600}.crop small{color:var(--muted);font-weight:400;font-size:14px}
.pill{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.harv{background:var(--leaf);color:var(--leaf-ink)}.pill.warn{background:var(--warn);color:var(--warn-ink)}
.next{margin:0;font-size:14px;color:var(--muted)}.next b{color:var(--ink)}
.barw{padding-top:16px}.bar{position:relative;height:14px;border-radius:7px;background:var(--soft)}
.seg{position:absolute;top:0;bottom:0;border-radius:7px;min-width:6px}
.sow{background:var(--sow)}.germ{background:var(--germ)}.thin{background:var(--thin)}.feed{background:var(--feed)}.harv{background:var(--harv)}
.today{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--today);border-radius:2px}
.today::after{content:"today";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--today)}
.dates{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px}
.dates li{display:contents}.k{color:var(--muted);display:flex;align-items:center;gap:7px}.k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.v{font-variant-numeric:tabular-nums}
.note{margin:0;font-size:14px;color:var(--muted)}
details>summary{cursor:pointer;font-family:var(--fd);font-weight:600;font-size:18px;padding:6px 0}
details .list{margin-top:10px}.row.done{opacity:.85}
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.index a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.index a b{font-family:var(--fd);font-size:28px;color:var(--leaf)}.index a span{color:var(--muted);font-size:13px}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
button.pr{align-self:flex-start;font:inherit;font-weight:700;border:2px solid var(--leaf);background:transparent;color:var(--leaf);padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px}
@page{size:A5 portrait;margin:10mm}
@media print{body{background:#fff;color:#000;padding:0}.switch,button.pr,.index{display:none}.row,.hero{break-inside:avoid;box-shadow:none}.hero{background:#EEF3E2}}

   const n=P.filter(p=>p.plot===x[0]&&["growing","late"].includes(stat(p))).length;a.appendChild(h("span",null,n?n+" growing now":"Nothing growing now"));idx.appendChild(a)});app.appendChild(idx);
 }else{
  const hero=h("div","hero");hero.appendChild(h("h1","code",pl[1]));hero.appendChild(h("p","sub",pl[2]+" · updated "+fmt(d(UPDATED))));app.appendChild(hero);
  const sw=h("nav","switch");sw.setAttribute("aria-label","Plots");
  PLOTS.forEach(x=>{const a=document.createElement("a");a.href="#"+x[0];a.textContent=x[1];if(x[0]===key)a.setAttribute("aria-current","page");sw.appendChild(a)});app.appendChild(sw);
  const items=P.filter(p=>p.plot===key),by=k=>items.filter(p=>k.includes(stat(p)));
  const g=section("Growing now",by(["growing","late"])),n=section("Coming up",by(["planned"]));
  [g,n].forEach(x=>x&&app.appendChild(x));
  if(!g&&!n){const e=h("p","sub","Nothing is growing here right now.");app.appendChild(e)}
  const fin=by(["ended"]);
  if(fin.length){const det=document.createElement("details"),sm=document.createElement("summary");sm.textContent="Finished ("+fin.length+")";det.appendChild(sm);const l=h("div","list");fin.forEach(p=>l.appendChild(row(p)));det.appendChild(l);app.appendChild(det)}
 }
 const f=document.createElement("footer");
 f.appendChild(h("span",null,"Dates are targets from the farm calendar and Farm Log. Arugula and other cut-and-come-again crops often keep producing after the last date."));
 const bt=h("button","pr","Print this plot");bt.type="button";bt.addEventListener("click",()=>window.print());if(pl)f.appendChild(bt);
 app.appendChild(f)}
window.addEventListener("hashchange",render);render();
</script></body></html>
